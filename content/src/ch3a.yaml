  - id: ch3-education
    title: Education
    src: "Ch. 3 slides, slides 25–26"
    explain: >-
      Higher education is strongly linked to better jobs and higher incomes, which determine spending power; degree holders earn
      significantly more on average, and Canada is highly educated. Marketers combine education with occupation and income to
      better predict buying behaviour, segmenting beyond income alone and targeting education-based preferences.
    alt: >-
      Education is an early clue to future income — and combined with job and pay, it sharpens predictions of what people buy.
    terms:
      Education (demographic): "Level of schooling, linked to income and therefore spending power."
    example: "Illustrative: a premium business-news subscription targets university-educated professionals."
    recall:
      - q: "Education is related to income, which determines:"
        o: ["Spending power", "Country culture", "Patents", "Interest rates"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Marketers improve predictions of buying behaviour by combining education with:"
        o: ["Occupation and income", "Climate and topography", "Jingles and slogans", "Scanner data only"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
    practice:
      - q: "A financial-planning firm targets university graduates in professional jobs with higher incomes. It is combining:"
        t: app
        o: ["Education, occupation and income", "Culture and technology", "Corporate partners", "Political factors"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Why should marketers 'segment beyond income alone'?"
        o: ["Education and occupation add predictive power", "Income has no effect", "It's illegal to use income", "Education is psychographic"]
        a: A
        e: ["Correct.", "No.", "No.", "It's demographic."]
      - q: "Which statement is supported by the slides?"
        o: ["Degree holders earn significantly more on average", "Education has no link to jobs", "Canada has low education levels", "Education is a micro factor"]
        a: A
        e: ["Correct.", "No.", "Canada is highly educated.", "No."]
      - q: "The notes say lifelong learning has become key because of:"
        o: ["The global economy", "Inflation targets", "Corporate partners", "PRIZM"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "An online-course provider targets mid-career workers seeking new skills. This responds to which trend?"
        t: app
        o: ["Lifelong learning / education", "Greenwashing", "Recession", "Regional subcultures"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]

  - id: ch3-gender
    title: Gender
    src: "Ch. 3 slides, slides 27–29"
    explain: >-
      Gender roles are blurring, pushing firms to design and position products beyond traditional male–female boundaries and to
      focus on inclusivity and shared decision-making. Women are now decision makers, not just influencers: they outperform men in
      education, head more than 20% of Canadian households, and make the majority of household purchasing decisions.
    alt: >-
      The old "pink aisle / blue aisle" map is outdated — marketers now design for whoever is actually deciding, and that's often
      women.
    terms:
      Blurring gender roles: "Traditional male/female roles are less distinct, affecting product design and positioning."
    example: "Illustrative (from slides): RONA+ redesigned stores with brighter spaces and open floor plans that appeal to female DIYers; Bandai Namco's mixed-gender gaming tournament."
    recall:
      - q: "According to the slides, women are now:"
        o: ["Decision makers, not just influencers", "Only influencers", "Excluded from household purchases", "A dissociative group"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Gender is part of which macro factor?"
        o: ["Demographics", "Technology", "Economic situation", "Political/legal"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
    practice:
      - q: "RONA+ redesigned its stores with brighter spaces and open floor plans mainly to:"
        t: app
        o: ["Appeal to female home decorators and DIYers", "Reduce inflation", "Target only contractors", "Comply with privacy law"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Blurring gender roles push firms to:"
        o: ["Design and position products beyond traditional boundaries", "Use more stereotypes", "Ignore women shoppers", "Avoid inclusivity"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "A toolmaker launches gender-neutral ads showing a range of people renovating homes. It is responding to:"
        t: app
        o: ["Changing gender roles (demographics)", "Exchange rates", "Robotics", "Regional subcultures"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Which statistic appears in the slide notes?"
        o: ["Women head more than 20% of Canadian households", "Women make no purchase decisions", "Men make all household decisions", "Women are 5% of the workforce"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Bandai Namco's 'Bonnie-and-Clyde' tournament with mixed-gender teams aimed to:"
        o: ["Encourage female gamers", "Exclude female gamers", "Lower prices", "Test a prototype"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
