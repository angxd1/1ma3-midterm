  - id: ch7-primary-data
    title: Primary data — advantages & disadvantages
    src: "Ch. 7 slides, p. 29"
    explain: >-
      Primary data are collected specifically to answer the current research question, using observation, surveys, interviews or
      focus groups. The main advantage: they can be tailored to the firm's specific decision needs. The disadvantages: they're
      typically more costly and time-consuming than secondary data. Proper design and unbiased collection are essential — poorly
      designed samples, biased questions or unrepresentative respondents lead to inaccurate conclusions.
    alt: >-
      Primary data is a custom-tailored suit — fits perfectly, but costs more and takes longer than buying off the rack.
    terms:
      Primary data advantage: "Tailored to the firm's specific decision needs."
      Primary data disadvantage: "More costly and time-consuming than secondary data."
    example: "Illustrative: a phone maker runs its own survey of 2,000 Canadian students about camera features it's considering."
    recall:
      - q: "The main advantage of primary research is that it is:"
        o: ["Tailored to the firm's specific needs", "Always free", "Faster than secondary", "Collected by competitors"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Primary research is typically:"
        o: ["More costly and time-consuming than secondary", "Cheaper than secondary", "Already collected", "Syndicated"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
    practice:
      - q: "A survey only of a brand's most loyal fans would risk:"
        t: app
        o: ["Unrepresentative respondents and inaccurate conclusions", "Too much veracity", "Brand extension", "Lower costs"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Which methods collect primary data?"
        o: ["Observation, surveys, interviews, focus groups", "Census reports", "Trade journals", "Nielsen reports"]
        a: A
        e: ["Correct.", "Secondary.", "Secondary.", "Secondary (syndicated)."]
      - q: "Why is unbiased data collection essential?"
        o: ["Biased questions or samples lead to inaccurate conclusions", "It's cheaper", "It's legally required for all research", "It increases velocity"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "A firm needs to know how its exact new flavour is received — no existing data covers it. It should use:"
        t: app
        o: ["Primary data", "Census data", "Old trade journals", "Wikipedia"]
        a: A
        e: ["Correct — tailored to the specific need.", "No.", "No.", "No."]
      - q: "Primary vs secondary: which statement is correct?"
        o: ["Primary is collected for the current question; secondary existed beforehand", "Both are collected beforehand", "Secondary is always tailored", "Primary is always free"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
