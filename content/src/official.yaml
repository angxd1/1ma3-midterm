- id: sm-4
  ch: 6
  pastMidterm: true
  src: "Sample Midterm Q4; Ch. 6 slides, slides 7, 12"
  c: [ch6-demographic]
  twin: ch6-demographic-p1
  q: "A company is interested in understanding the factors that influence consumers' choices when buying organic food products. Which of the following questions would be considered a demographic question?"
  o: ["\"What motivates you to purchase organic food products?\"", "\"Do you have children under the age of 18 in your household?\"", "\"How often do you shop for groceries in a given month?\"", "\"Describe your experience with organic food products.\"", "\"Which organic brands do you trust the most?\""]
  a: B
  e: ["Motivations are psychographic.", "Correct — household composition/family size is demographic.", "Usage frequency is behavioural.", "An open-ended experience question, not demographic.", "Brand trust/loyalty is behavioural/attitudinal."]
