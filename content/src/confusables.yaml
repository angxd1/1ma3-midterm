- id: cf-testing
  title: Concept testing vs alpha vs beta vs premarket vs test marketing
  c: [ch8-concept-testing, ch8-product-development, ch8-market-testing]
  src: "Ch. 8 slides, slides 38–43"
  cols: [Concept testing, Alpha testing, Beta testing, Premarket test, Test marketing]
  rows:
    - [What is tested, "A description of the idea", "Prototype, internally", "Prototype, by potential customers in real use", "Product, controlled environment", "Product, real sales in a limited area"]
