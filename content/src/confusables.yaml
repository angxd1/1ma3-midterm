    - q: "Which group's adoption drives profitability once risks are reduced?"
      o: ["Early majority", "Innovators", "Laggards", "Early adopters"]
      a: A
      e: ["Correct.", "No.", "No.", "No."]
- id: cf-diffusion
  title: Relative advantage vs compatibility vs observability vs trialability
  c: [ch8-relative-advantage, ch8-compatibility, ch8-observability, ch8-complexity-trialability]
  src: "Ch. 8 slides, slides 17–21"
  cols: [Relative advantage, Compatibility, Observability, Complexity & trialability]
  rows:
    - [Question, "Is it better than substitutes?", "Does it fit how I live/my values?", "Can I see others using it?", "Is it easy to understand and try?"]
    - [Example, "Swiffer vs mop", "Starbucks in tea cultures", "Blendtec 'Will It Blend?'", "Dyson in-store demo; free trial"]
  tip: "Better? Fits? Visible? Easy to try? — yes speeds diffusion (complexity: yes slows it)."
  questions:
    - q: "A product that clashes with local cultural habits will diffuse slowly due to low:"
      o: ["Compatibility", "Observability", "Relative advantage", "Trialability"]
      a: A
      e: ["Correct.", "No.", "No.", "No."]
    - q: "Free 30-day trials increase:"
      o: ["Trialability", "Compatibility", "Observability", "Complexity"]
      a: A
      e: ["Correct.", "No.", "No.", "No."]
