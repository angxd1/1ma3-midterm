  questions:
    - q: "Employees try a new 3D printer in the firm's R&D facility. This is:"
      t: app
      o: ["Alpha testing", "Beta testing", "Premarket testing", "Concept testing"]
      a: A
      e: ["Correct.", "Beta uses customers.", "No.", "No prototype in concept testing."]
    - q: "A new soda is sold only in Winnipeg before a national rollout. This is:"
      t: app
      o: ["Test marketing", "Premarket testing", "Beta testing", "Concept testing"]
      a: A
      e: ["Correct.", "No — that's a controlled setting.", "No.", "No."]
- id: cf-adopters
  title: Innovators vs early adopters; early vs late majority
  c: [ch8-adopter-categories]
  src: "Ch. 8 slides, slides 13–14"
  cols: [Innovators, Early adopters, Early majority, Late majority]
