- id: cf-ownership
  title: Manufacturer vs private-label vs generic; family vs individual
  c: [ch9-brand-ownership, ch9-family-individual]
  src: "Ch. 9 slides, pp. 21–25"
  cols: [Manufacturer, Private label, Generic, Family brand, Individual brand]
  rows:
    - [Meaning, "Owned by the maker", "Owned by the retailer", "No brand name", "Company name across products", "Separate name per product"]
