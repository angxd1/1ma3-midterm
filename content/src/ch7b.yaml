  - id: ch7-analytics
    title: Marketing analytics & data warehouses
    src: "Ch. 7 slides, pp. 46, 49–50"
    explain: >-
      Firms store massive amounts of customer and transaction information in data warehouses holding billions of data points.
      Marketing analytics uses advanced models and technologies to transform big data into insights that support better marketing
      decisions, integrating qualitative and quantitative methods to optimise marketing performance and customer strategies.
    alt: >-
      The data warehouse is the library; analytics is the librarian who finds the useful book and reads you the key page.
    terms:
      Data warehouse: "A store of massive amounts of customer and transaction data."
      Marketing analytics: "Using models and technology to turn big data into insights for marketing decisions."
    example: "Illustrative: a retailer's analytics team uses years of loyalty-card data to decide which stores get which products."
    recall:
      - q: "Marketing analytics is primarily used to:"
        o: ["Transform large datasets into insights that improve marketing decisions", "Eliminate the need for research", "Store data without analysing it", "Reduce the number of segments"]
        a: A
        e: ["Correct (p.49).", "No.", "No.", "No."]
      - q: "Firms store massive customer and transaction data in:"
        o: ["Data warehouses", "Focus groups", "Projective tests", "Slogans"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
    practice:
      - q: "Marketing analytics integrates:"
        o: ["Qualitative and quantitative methods", "Only qualitative", "Only intuition", "Only secondary census data"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "A firm that collects billions of data points but never analyses them is missing:"
        t: app
        o: ["Marketing analytics", "A data warehouse", "Data", "Customers"]
        a: A
        e: ["Correct.", "It has one.", "It has data.", "No."]
      - q: "Data warehouses contain:"
        o: ["Billions of data points on customers and transactions", "Only product prototypes", "Only slogans", "Only laws"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Analytics supports decisions about:"
        o: ["Marketing performance and customer strategies", "Only accounting", "Interest rates", "Census design"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Does marketing analytics eliminate the need for marketing research?"
        o: ["No — it builds on research methods to create insights", "Yes, entirely", "Only for small firms", "Only in Canada"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]

  - id: ch7-analytics-types
    title: Descriptive, predictive, prescriptive & active analytics
    src: "Ch. 7 slides, p. 47"
    explain: >-
      Descriptive analytics summarises past data; predictive analytics forecasts future outcomes; prescriptive analytics recommends
      optimal actions. Active analytics uses AI and Internet-of-Things data from connected devices to generate real-time insights.
      These tools help firms personalise offers, predict churn and improve decisions.
    alt: >-
      Descriptive = "what happened?", predictive = "what will happen?", prescriptive = "what should we do?", active = "what's
      happening right now?"
    terms:
      Descriptive analytics: "Summarises past data."
      Predictive analytics: "Forecasts future outcomes."
      Prescriptive analytics: "Recommends optimal actions."
      Active analytics: "Uses AI and IoT data for real-time insights."
    example: "Illustrative (from slides): Tesco analyses descriptive data on each product across 4,700 stores (up to 45 attributes) to target incentives to household profiles."
    recall:
      - q: "Analytics that forecasts future outcomes is:"
        o: ["Predictive", "Descriptive", "Prescriptive", "Active"]
        a: A
        e: ["Correct.", "Past.", "Recommends actions.", "Real-time."]
      - q: "Analytics that recommends optimal actions is:"
        o: ["Prescriptive", "Predictive", "Descriptive", "Active"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
    practice:
      - q: "A report showing last quarter's sales by region is:"
        t: app
        o: ["Descriptive analytics", "Predictive analytics", "Prescriptive analytics", "Active analytics"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "A model estimating which subscribers will cancel next month is:"
        t: app
        o: ["Predictive analytics", "Descriptive", "Prescriptive", "Qualitative"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Software that tells a manager the optimal discount to offer each customer is:"
        t: app
        o: ["Prescriptive analytics", "Descriptive", "Predictive", "Observation"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "A smart fridge streams usage data to adjust offers in real time. This is:"
        t: app
        o: ["Active analytics", "Descriptive analytics", "Focus group", "Panel data"]
        a: A
        e: ["Correct — AI + IoT, real time.", "No.", "No.", "No."]
        c: [ch3-iot]
      - q: "Tesco's analysis of product attributes across 4,700 stores is cited as:"
        o: ["Descriptive analytics", "Prescriptive analytics", "A projective technique", "Test marketing"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]

  - id: ch7-analytics-mix
    title: Marketing mix decisions made by analytics
    src: "Ch. 7 slides, p. 48"
    explain: >-
      Marketing analytics helps firms make marketing mix decisions by analysing customer behaviour across multiple channels. Big data
      lets firms identify target segments and tailor assortments, promotions and communications to local markets. Loyalty programs
      and customer tracking provide purchase-pattern data used to personalise strategies.
    alt: >-
      Analytics turns "what customers did" into "what we should sell, where, at what price and with which message".
    terms:
      Multichannel analytics: "Analysing customer behaviour across many points of contact to guide the marketing mix."
    example: "Illustrative (from slides): HSN gathers data across TV channels, catalogue and phone sales, and digital links."
