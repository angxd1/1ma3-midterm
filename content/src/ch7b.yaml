  - id: ch7-ethics
    title: Ethics of using customer information
    src: "Ch. 7 slides, pp. 51–52"
    explain: >-
      Ethical marketing research requires protecting consumer privacy, maintaining confidentiality and using data only for
      legitimate research purposes. Researchers must avoid misleading practices, misrepresenting results, or disguising selling as
      research. Laws and professional codes guide responsible collection, transparency and fair treatment. Smart devices can
      collect sensitive data (e.g., home layouts), so firms must obtain informed consent, disclose data use and protect data.
    alt: >-
      Ethical research treats participants' data like a borrowed key — use it only for what you said, and never copy it for others.
    terms:
      Informed consent: "Participants agree to data collection knowing how it will be used."
      Confidentiality: "Keeping participants' data private."
    example: "Illustrative (from slides): Frito-Lay's neuromarketing found shiny bags evoked guilt, so it switched to matte; a Roomba mapping and selling home layouts raises ethical concerns."
    recall:
      - q: "Disguising a sales pitch as research is:"
        o: ["Unethical", "Required", "A focus group", "Predictive analytics"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Before collecting household data via smart devices, firms must obtain:"
        o: ["Informed consent", "A patent", "A slogan", "Syndicated data"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
    practice:
      - q: "A robot vacuum maker sells customers' home-layout maps to third parties without disclosure. The main issue is:"
        t: app
        o: ["Unauthorised data sharing that damages trust", "Velocity of data", "Too few product lines", "Brand extension"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Which is an ethical research practice?"
        o: ["Maintaining confidentiality and using data only for legitimate purposes", "Misrepresenting results", "Hiding data use", "Selling data secretly"]
        a: A
        e: ["Correct.", "Unethical.", "Unethical.", "Unethical."]
      - q: "Frito-Lay's neuromarketing finding led it to:"
        o: ["Switch from shiny to matte chip bags", "Stop selling chips", "Raise prices", "Use focus groups only"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "What guides firms toward responsible data collection?"
        o: ["Laws and professional codes of conduct", "Competitors' ads", "Fashion cycles", "PRIZM"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "A survey company inflates positive results to please a client. This violates the rule against:"
        t: app
        o: ["Misrepresenting results", "Using structured questions", "Panel research", "Informed consent"]
        a: A
        e: ["Correct.", "No.", "No.", "Different principle."]

short_answers:
  - t: th
    c: [ch7-research-process, ch7-step1-define, ch7-step2-design, ch7-step3-collect, ch7-step4-analyze, ch7-step5-action]
    src: "Ch. 7 slides, pp. 7–13"
    q: "Explain the five steps of the marketing research process."
    model: |-
      The marketing research process has five steps. First, the firm defines the research problem and objectives — what information is needed to answer specific questions and how it should be obtained. For example, McDonald's studying its customer experience would also examine competitors like Wendy's. Second, it designs the research plan, identifying the type of data needed and the type of research to collect it; objectives drive these choices. Third, it collects data: secondary data (collected before the project, internal or external, often cheaper) and/or primary data (collected for the specific need through surveys, interviews, focus groups or observation).

      Fourth, it analyses data and develops insights. Raw data have limited value until organised and interpreted to reveal patterns and relationships that lead to changes in product features, pricing or promotion. Finally, it presents (determines) the action plan: a report with an executive summary, body (objectives, methodology, findings), conclusions and appendices, presented briefly, without jargon, suited to the audience and ending with recommendations.
    rubric:
      - p: "Step 1 define problem/objectives"
        k: ["define|problem|objective"]
      - p: "Step 2 design research plan"
        k: ["design|plan"]
      - p: "Step 3 collect data — secondary vs primary"
        k: ["collect", "secondary|primary"]
      - p: "Step 4 analyse data, develop insights"
        k: ["analy", "insight"]
      - p: "Step 5 action plan / report"
        k: ["action plan|report|present|recommendation"]
    mistakes:
      - "Mixing up the order of design and data collection."
      - "Not distinguishing primary from secondary data in step 3."
      - "Ending at analysis without the action plan."
  - t: th
    c: [ch7-step3-collect, ch7-primary-data, ch7-external-secondary, ch7-internal-secondary, ch7-secondary-disadvantages]
    src: "Ch. 7 slides, pp. 11, 16–29"
    q: "Compare primary and secondary data, including their advantages and disadvantages, with examples."
    model: |-
      Secondary data are pieces of information collected before the start of the focal project. They can be internal — invoices, customer lists and reports, often mined for patterns — or external, such as census data, trade journals and syndicated data bought from firms like Nielsen or Léger (including scanner and panel data). Their advantage is that they are free or inexpensive and quick to obtain. Their disadvantages are that they may not be the right data, may be outdated or not specific enough because they were collected for another purpose, and their reliability must be checked when collection methods are unknown.

      Primary data are collected specifically to answer the current research question, through observation, surveys, in-depth interviews or focus groups. Their main advantage is that they are tailored to the firm's specific decision needs; their disadvantages are higher cost and time, and the risk of inaccurate conclusions if samples or questions are biased. For example, a café might read Statistics Canada reports on coffee consumption (secondary) and then survey its own customers about a new drink (primary). Firms typically start with secondary data and collect primary data when needed.
    rubric:
      - p: "Defines secondary data"
        k: ["secondary", "prior|before|already|existing"]
      - p: "Defines primary data"
        k: ["primary", "specific|current|tailored"]
      - p: "Secondary advantages/disadvantages"
        k: ["cheap|inexpensive|free|quick", "outdated|not specific|reliab|relevan|different purpose"]
      - p: "Primary advantages/disadvantages"
        k: ["cost|time-consuming|expensive"]
      - p: "Examples given"
        k: ["census|nielsen|survey|focus group|interview|invoice"]
    mistakes:
      - "Saying primary data is always better — it's costlier and slower."
      - "Calling syndicated data primary data."
  - t: app
    c: [ch7-qualitative, ch7-focus-groups, ch7-in-depth-interview, ch7-surveys, ch7-questionnaire-pitfalls, ch7-quantitative]
    src: "Ch. 7 slides, pp. 30–41"
    q: "A campus bookstore wants to understand why students are buying fewer textbooks. Recommend qualitative and quantitative research methods it should use and explain what to avoid when designing its questionnaire."
    model: |-
      The bookstore should begin with qualitative, exploratory research to understand students' attitudes and motivations. A focus group of 8–10 students led by a trained moderator could reveal reasons such as online rentals, sharing PDFs or professors using open resources. In-depth interviews with a few students or professors would allow probing for detail, and observation of how students move through the store could show behaviour they can't explain. Social media monitoring is inexpensive but not representative.

      It should then use quantitative research to measure how widespread each reason is, such as an online survey of a large sample of students with mostly structured (closed-ended) questions, plus a few unstructured ones. When designing the questionnaire, it should avoid double-barreled questions ("Are our prices and hours satisfactory?"), leading questions ("Our prices are fair, right?"), one-sided questions, implicit assumptions, sensitive questions, and questions students can't accurately answer ("How much did you spend on books in 2023?"). Finally, it should analyse the results and present a short, jargon-free action plan.
    rubric:
      - p: "Qualitative methods recommended (focus group/interview/observation)"
        k: ["qualitative|exploratory", "focus group|interview|observation"]
      - p: "Quantitative method (survey/experiment)"
        k: ["quantitative|survey|experiment"]
      - p: "Structured vs unstructured questions"
        k: ["structured|closed|open"]
      - p: "Questionnaire pitfalls named"
        k: ["double-barreled|double barreled|leading|one-sided|implicit|sensitive"]
      - p: "Applied to the bookstore"
        k: ["student|textbook|bookstore"]
    mistakes:
      - "Recommending only one research type."
      - "Naming pitfalls without examples."
  - t: th
    c: [ch7-analytics, ch7-analytics-types, ch7-big-data, ch7-ethics]
    src: "Ch. 7 slides, pp. 18, 46–52"
    q: "Explain marketing analytics, the types of analytics, and the ethical issues firms face when using customer information."
    model: |-
      Firms store huge amounts of customer and transaction information in data warehouses, and much of it is big data — data sets too large and complex for conventional software, characterised by volume, variety, velocity, veracity and value. Marketing analytics uses advanced models and technology to transform this data into insights for better marketing decisions. Descriptive analytics summarises past data (Tesco analysing product attributes across its stores), predictive analytics forecasts future outcomes such as customer churn, prescriptive analytics recommends optimal actions, and active analytics uses AI and IoT data for real-time insights. Analytics also guides marketing mix decisions, such as tailoring assortments and promotions with loyalty-program data.

      Using customer information raises ethical issues. Researchers must protect privacy, maintain confidentiality and use data only for legitimate purposes; they must not mislead participants, misrepresent results or disguise selling as research. Smart devices, such as a Roomba mapping home layouts, can collect sensitive data, so firms need informed consent, clear disclosure of data use and strong data protection. Laws and professional codes of conduct guide these practices.
    rubric:
      - p: "Defines marketing analytics / data warehouses / big data"
        k: ["analytics", "big data|data warehouse"]
      - p: "Descriptive, predictive, prescriptive (and active)"
        k: ["descriptive", "predictive", "prescriptive"]
      - p: "Privacy / confidentiality"
        k: ["privacy|confidential"]
      - p: "Informed consent / disclosure"
        k: ["consent|disclos|transparen"]
      - p: "Misrepresentation / disguised selling"
        k: ["mislead|misrepresent|disguis"]
    mistakes:
      - "Confusing predictive (forecast) with prescriptive (recommend)."
      - "Discussing ethics only as 'don't break the law' without specific practices."

