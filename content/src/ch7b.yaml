chapter: 7
concepts:
  - id: ch7-qualitative
    title: Qualitative (exploratory) research
    src: "Ch. 7 slides, pp. 30–31"
    explain: >-
      Qualitative research is exploratory — used to understand attitudes, perceptions and motivations rather than to measure them
      numerically. The slides list its methods as observation, social media, in-depth interviews, focus groups and projective
      techniques, and flag reliability, validity and sampling as considerations.
    alt: >-
      Qualitative research asks "why?" and "how do you feel?" — it explores before quantitative research counts.
    terms:
      Qualitative research: "Exploratory research aimed at understanding — via observation, social media, interviews, focus groups, projective techniques."
    example: "Illustrative: before designing a survey, a brand holds a few interviews to learn what words customers use to describe the product."
    recall:
      - q: "Qualitative research is primarily:"
        o: ["Exploratory", "Experimental", "Numerical hypothesis testing", "Scanner-based"]
        a: A
        e: ["Correct.", "Quantitative.", "Quantitative.", "Quantitative."]
      - q: "Which is a qualitative research method listed on the slides?"
        o: ["Projective techniques", "Experiments", "Scanner data", "Structured surveys"]
        a: A
        e: ["Correct.", "Quantitative.", "Quantitative.", "Quantitative."]
    practice:
      - q: "Which list contains only qualitative methods from the slides?"
        o: ["Observation, social media, in-depth interviews, focus groups, projective techniques", "Surveys, panels, experiments", "Scanner data, panel data", "Census, trade journals"]
        a: A
        e: ["Correct.", "Quantitative.", "Quantitative.", "Secondary sources."]
      - q: "A brand wants to explore why young people feel 'excluded' by beauty ads before designing a survey. It should start with:"
        t: app
        o: ["Qualitative research", "An experiment", "Scanner data", "Test marketing"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Which considerations does the qualitative research slide flag?"
        o: ["Reliability, validity, sampling", "Volume, velocity, value", "Price, place, promotion", "Breadth, depth, category"]
        a: A
        e: ["Correct.", "Big data.", "Marketing mix.", "Ch 9."]
      - q: "Projective techniques, per the slides, are a:"
        o: ["Qualitative research method", "Quantitative method", "Secondary data source", "Pricing strategy"]
        a: A
        e: ["Correct — named as a qualitative method (no definition given; see CONTENT_NOTES #24).", "No.", "No.", "No."]
        c: [ch7-projective]
      - q: "Qualitative vs quantitative: which is correct?"
        o: ["Qualitative explores; quantitative measures with numbers", "Both only use numbers", "Qualitative tests hypotheses statistically", "Quantitative is always exploratory"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
        c: [ch7-quantitative]

  - id: ch7-observation
    title: Observation research
    src: "Ch. 7 slides, p. 32"
    explain: >-
      Observation research directly watches consumers' behaviours, in person or through cameras, sensors or eye-tracking. It's
      especially useful when consumers can't clearly explain their behaviour, revealing real usage patterns, shopping paths and
      product interactions. Observational and ethnographic insights help improve product design, store layouts, merchandising and
      promotions.
    alt: >-
      Observation is "watch what they do, not what they say" — a heat map never lies about where shoppers walked.
    terms:
      Observation research: "Directly watching consumers' behaviour, in person or via technology."
    example: "Illustrative (from slides): in-store tracking systems and heat maps (Shopperception) show where shoppers look, move and interact with products."
    recall:
      - q: "Observation is especially useful when consumers:"
        o: ["Cannot clearly explain their behaviour", "Are very articulate", "Fill out surveys quickly", "Are not in stores"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Heat maps of shopper movement are a form of:"
        o: ["Observation research", "Focus groups", "Syndicated data", "Experiments"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
    practice:
      - q: "Chris, a Loblaws manager, has staff monitor customers' behaviour toward new products in the store. He is using:"
        t: app
        o: ["Observation", "In-depth interviews", "Panel research", "Survey research"]
        a: A
        e: ["Correct.", "No conversation.", "No ongoing panel.", "No questionnaire."]
      - q: "Observation insights help firms improve:"
        o: ["Product design, store layouts and merchandising", "Interest rates", "Census data", "Legislation"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Eye-tracking a shopper's gaze across a shelf is:"
        t: app
        o: ["Observation through technology", "A projective technique", "Secondary data", "A double-barreled question"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Which is a benefit of observation over asking people?"
        o: ["It reveals actual behaviour rather than reported behaviour", "It's always cheaper", "It explains motivations directly", "It produces syndicated data"]
        a: A
        e: ["Correct.", "Not necessarily.", "It shows what, not always why.", "No."]
      - q: "Observation is classified as:"
        o: ["Qualitative research", "Secondary data", "Experimental research", "Big data"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]

  - id: ch7-social-media
    title: Social media research
    src: "Ch. 7 slides, pp. 33–36"
    explain: >-
      Social media provide large volumes of real-time consumer opinions and behaviour. By monitoring and mining conversations, firms
      identify preferences, track brand sentiment and respond quickly to complaints or trends. Pros: large accessible sample, people
      of all ages, lots of brand-related data, very current, consumers freely offer opinions (no interviewer bias), data can be
      searched and filtered. Cons: not statistically representative, feedback may not be well thought out, anonymity can encourage
      extreme opinions, no depth about the consumer, no chance to probe, and no consent to study data (ethical issues).
    alt: >-
      Social media is a giant, noisy town square — easy to overhear lots of honest opinions, but you can't ask follow-ups and the
      loudest voices aren't representative.
    terms:
      Social media research: "Monitoring and mining social media conversations for insights."
    example: "Illustrative: a restaurant chain tracks negative mentions on X/TikTok in real time to respond to complaints."
    recall:
      - q: "Which is a key advantage of social media research?"
        o: ["Conversations are observed only", "No consent to study data", "Contributors rarely are shy about giving opinions", "Anonymity"]
        a: C
        e: ["A con — no chance to probe.", "A con — ethical issue.", "Correct — consumers freely offer opinions.", "A con — encourages extreme comments."]
      - q: "A limitation of social media data is that it is:"
        o: ["Not a statistically representative sample", "Always outdated", "Very small", "Expensive to access"]
        a: A
        e: ["Correct.", "It's very current.", "It's large.", "It's inexpensive."]
    practice:
      - q: "A brand can't ask a tweeter what they meant by a vague complaint. Which con is this?"
        t: app
        o: ["No opportunity to probe for more detail", "Large accessible sample", "No interviewer bias", "Very current feedback"]
        a: A
        e: ["Correct.", "Pro.", "Pro.", "Pro."]
      - q: "Why might anonymity reduce reliability?"
        o: ["It can encourage extreme opinions and comments", "It makes data older", "It reduces sample size", "It increases cost"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Which is a pro of social media research?"
        o: ["No interviewer bias", "Depth of information about each consumer", "Consent always obtained", "Statistically representative"]
        a: A
        e: ["Correct.", "Con — no depth.", "Con — no consent.", "Con."]
      - q: "A firm studies public posts without users' permission. The slides flag:"
        o: ["Potential ethical issues", "Higher velocity", "Better representativeness", "Brand dilution"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
        c: [ch7-ethics]
      - q: "Social media data are inexpensive and accessible, but researchers must be cautious because:"
        o: ["Anonymity and lack of validation can reduce reliability", "They're always fake", "They are syndicated", "They're primary experiments"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]

  - id: ch7-in-depth-interview
    title: In-depth interviews
    src: "Ch. 7 slides, p. 37"
    explain: >-
      In-depth interviews are one-on-one conversations in which trained researchers ask detailed questions and probe further to
      understand respondents' experiences, attitudes and motivations. They provide rich individual-level insights but are
      time-consuming and relatively expensive, especially when specialised respondents are required.
    alt: >-
      An in-depth interview is a deep conversation with one person — rich detail, but you can only have so many.
    terms:
      In-depth interview: "A trained researcher asks detailed one-on-one questions and probes for deeper insight."
    example: "Illustrative: a medical-device firm interviews 12 surgeons individually about frustrations with current tools."
    recall:
      - q: "In-depth interviews are conducted:"
        o: ["One-on-one", "With large online panels", "Via scanners", "In groups of 8–12"]
        a: A
        e: ["Correct.", "No.", "No.", "Focus groups."]
      - q: "A drawback of in-depth interviews is that they are:"
        o: ["Time-consuming and relatively expensive", "Too shallow", "Always biased", "Syndicated"]
        a: A
        e: ["Correct.", "They're rich.", "Not stated.", "No."]
    practice:
      - q: "A researcher sits with one customer for an hour, asking follow-up 'why' questions. This is:"
        t: app
        o: ["An in-depth interview", "A focus group", "Observation", "A survey"]
        a: A
        e: ["Correct.", "Group.", "No conversation.", "No questionnaire."]
      - q: "In-depth interviews provide:"
        o: ["Rich, individual-level insights", "Statistically representative data", "Real-time scanner data", "Census data"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Interviews become especially costly when:"
        o: ["Specialised respondents are required", "Respondents are students", "Questions are short", "They're online"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Compared with social media research, in-depth interviews allow researchers to:"
        o: ["Probe for more detail", "Avoid any cost", "Reach millions", "Avoid trained staff"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Which method best uncovers a B2B buyer's detailed motivations?"
        t: app
        o: ["In-depth interview", "Scanner data", "Census", "Test marketing"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]

  - id: ch7-focus-groups
    title: Focus groups
    src: "Ch. 7 slides, p. 38"
    explain: >-
      A focus group brings together a small group of participants to discuss a specific topic under the guidance of a trained
      moderator, generating qualitative insights about attitudes and perceptions. It helps marketers understand reactions to
      products, advertising, pricing or competitors, often revealing insights surveys miss. Focus groups can now be run online,
      reducing costs and including participants from different locations.
    alt: >-
      A focus group is a guided group chat — a moderator steers, participants spark off each other.
    terms:
      Focus group: "A small group discussing a topic under a trained moderator to generate qualitative insights."
    example: "Illustrative (from slides): A&W focus groups revealed many consumers thought a 1/4-pound burger was bigger than a 1/3-pound burger."
    recall:
      - q: "A focus group is led by a:"
        o: ["Trained moderator", "Scanner", "Census taker", "Sales rep"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "What did A&W's focus groups reveal?"
        o: ["Consumers thought 1/4 lb was larger than 1/3 lb", "People hate burgers", "Prices were too low", "Nothing useful"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
    practice:
      - q: "A brand gathers 8 customers with a moderator to discuss reactions to a new ad. This is:"
        t: app
        o: ["A focus group", "An in-depth interview", "Panel data", "An experiment"]
        a: A
        e: ["Correct.", "One-on-one.", "No.", "No."]
      - q: "An advantage of online focus groups is:"
        o: ["Lower costs and participants from different locations", "Statistical representativeness", "No moderator needed", "Scanner accuracy"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Focus groups generate what kind of insight?"
        o: ["Qualitative insights about attitudes and perceptions", "Precise sales forecasts", "Census counts", "Exchange rates"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "The A&W case shows focus groups can reveal:"
        t: app
        o: ["Misunderstandings that strongly influence product success", "Exact market share", "Legal requirements", "Supplier costs"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Focus groups vs surveys: focus groups often reveal insights that surveys:"
        o: ["May not capture", "Always capture better", "Measure numerically", "Make syndicated"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]

  - id: ch7-projective
    title: Projective techniques
    src: "Ch. 7 slides, p. 31"
    explain: >-
      Projective techniques are named on the slides as one of the five qualitative research methods (alongside observation, social
      media, in-depth interviews and focus groups). The slides give no further definition, so for the midterm know it as a
      qualitative, exploratory method. (Flagged in CONTENT_NOTES — no definition invented.)
    alt: >-
      Treat projective techniques as one of the "five qualitative tools" on the slide — recognise the name and its category.
    terms:
      Projective techniques: "A qualitative research method listed on the slides (no definition provided)."
    example: "Illustrative: on an exam, if asked which option is a qualitative method, 'projective techniques' is a valid answer per the slides."
    recall:
      - q: "Projective techniques are classified on the slides as:"
        o: ["A qualitative research method", "A quantitative method", "Secondary data", "A positioning strategy"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Which is listed together with projective techniques as a qualitative method?"
        o: ["Focus groups", "Experiments", "Scanner data", "Panel data"]
        a: A
        e: ["Correct.", "Quantitative.", "Quantitative.", "Quantitative."]
    practice:
      - q: "How many qualitative methods appear on the slide that names projective techniques?"
        o: ["Five", "Two", "Seven", "Three"]
        a: A
        e: ["Correct — observation, social media, in-depth interviews, focus groups, projective techniques.", "No.", "No.", "No."]
      - q: "Which is NOT a qualitative method on the slide?"
        o: ["Projective techniques", "In-depth interviews", "Observation", "Experiments"]
        a: D
        e: ["Qualitative.", "Qualitative.", "Qualitative.", "Correct — quantitative."]
      - q: "A researcher wants exploratory insight and chooses projective techniques. Which research type is this?"
        t: app
        o: ["Qualitative", "Quantitative", "Experimental", "Syndicated"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Projective techniques are part of which research approach?"
        o: ["Exploratory", "Descriptive statistics", "Prescriptive analytics", "Scanner tracking"]
        a: A
        e: ["Correct — qualitative = exploratory.", "No.", "No.", "No."]
      - q: "In the additional practice question about Loblaws staff monitoring customers, why is 'projective technique' wrong?"
        t: app
        o: ["The staff are watching behaviour — that's observation", "Projective techniques are quantitative", "It's secondary data", "It's a panel"]
        a: A
        e: ["Correct.", "No — it's qualitative.", "No.", "No."]
        c: [ch7-observation]

  - id: ch7-quantitative
    title: Quantitative research
    src: "Ch. 7 slides, p. 39"
    explain: >-
      Quantitative research uses numerical data to test hypotheses, measure relationships and support decisions. It can be
      descriptive (e.g., profiling brand users) or experimental (e.g., testing product formulations in controlled studies). Common
      methods: surveys, panel data collection and experiments.
    alt: >-
      Quantitative research counts and tests — it turns opinions and behaviours into numbers you can compare.
    terms:
      Quantitative research: "Research using numerical data to test hypotheses and measure relationships."
    example: "Illustrative: a survey of 1,000 shoppers measures how many prefer each of three package designs."
    recall:
      - q: "Quantitative research uses:"
        o: ["Numerical data to test hypotheses", "Only open discussion", "Only observation", "Only social media"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Which is a quantitative method?"
        o: ["Experiments", "Focus groups", "In-depth interviews", "Projective techniques"]
        a: A
        e: ["Correct.", "Qualitative.", "Qualitative.", "Qualitative."]
    practice:
      - q: "Profiling the average age and income of brand users is:"
        t: app
        o: ["Descriptive quantitative research", "Experimental research", "A focus group", "Projective research"]
        a: A
        e: ["Correct.", "No manipulation.", "No.", "No."]
      - q: "Common quantitative methods include:"
        o: ["Surveys, panel data and experiments", "Focus groups and interviews", "Observation and social listening", "Projective techniques"]
        a: A
        e: ["Correct.", "Qualitative.", "Qualitative.", "Qualitative."]
      - q: "Testing two product formulas in a controlled study is:"
        t: app
        o: ["Experimental quantitative research", "Descriptive research", "Secondary data", "Observation"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Quantitative research supports managerial decisions by:"
        o: ["Measuring relationships with numbers", "Telling stories", "Writing slogans", "Licensing brands"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Which statement is correct?"
        o: ["Quantitative can be descriptive or experimental", "Quantitative is always exploratory", "Quantitative never uses surveys", "Quantitative is the same as qualitative"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]

  - id: ch7-surveys
    title: Surveys & questionnaire question types
    src: "Ch. 7 slides, p. 40"
    explain: >-
      A survey is a quantitative method that collects information from respondents using a questionnaire designed to meet specific
      research objectives. Surveys can be administered online, by telephone, mail or in person. Questions may be unstructured
      (open-ended — respondents answer freely) or structured (closed-ended — predefined response options).
    alt: >-
      Structured = multiple choice; unstructured = short answer.
    terms:
      Survey: "Collecting information from respondents using a questionnaire designed to meet research objectives."
      Structured question: "Closed-ended, with predefined response options."
      Unstructured question: "Open-ended, allowing respondents to answer freely."
    example: "Illustrative: 'Rate your visit 1–5' is structured; 'Tell us about your visit' is unstructured."
    recall:
      - q: "An open-ended question is:"
        o: ["Unstructured", "Structured", "Leading", "Double-barreled"]
        a: A
        e: ["Correct.", "Closed-ended.", "A pitfall.", "A pitfall."]
      - q: "A survey is an example of which research type?"
        o: ["Quantitative", "Qualitative", "Secondary", "Projective"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
    practice:
      - q: "'How satisfied are you? (Very / Somewhat / Not)' is a(n):"
        t: app
        o: ["Structured question", "Unstructured question", "Projective technique", "Observation"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "'Describe your experience with organic food products.' is a(n):"
        t: app
        o: ["Unstructured question", "Structured question", "Demographic question", "Scanner record"]
        a: A
        e: ["Correct — open-ended.", "No.", "No.", "No."]
      - q: "Surveys can be administered through:"
        o: ["Online, telephone, mail or in-person", "Only mail", "Only in person", "Scanners"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Questionnaires are designed to meet:"
        o: ["Specific research objectives", "Advertising targets", "Legal quotas", "Brand slogans"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "A researcher wants easily comparable numbers across 2,000 respondents. Which question type fits best?"
        t: app
        o: ["Structured (closed-ended)", "Unstructured (open-ended)", "Projective", "Observation"]
        a: A
        e: ["Correct.", "Harder to compare.", "No.", "No."]

  - id: ch7-questionnaire-pitfalls
    title: What to avoid when designing a questionnaire
    src: "Ch. 7 slides, p. 41"
    explain: >-
      Avoid: questions respondents can't easily or accurately answer ("How much did you spend on groceries last month?"); sensitive
      questions unless necessary; double-barreled questions that refer to more than one issue with one set of responses; leading
      questions that steer respondents ("Volvo is the safest car on the road, right?"); one-sided questions that present only one
      side; questions with implicit assumptions ("Since caffeine is a stimulant, should children…"); and complex or unfamiliar
      questions ("Are mechanical watches better than quartz?").
    alt: >-
      A good question is one question, neutral, answerable and plain — anything else bends the answers.
    terms:
      Double-barreled question: "Refers to more than one issue with only one set of responses."
      Leading question: "Steers respondents to a particular response regardless of true beliefs."
      Implicit assumption: "Presumes the same point of reference for all respondents."
      One-sided question: "Presents only one side of an issue."
    example: "Illustrative (from slides): 'Do you think Elizabeth May or Justin Trudeau would make a good prime minister?' is double-barreled."
    recall:
      - q: "'Volvo is the safest car on the road, right?' is a:"
        o: ["Leading question", "Double-barreled question", "Structured question", "Fair question"]
        a: A
        e: ["Correct.", "One issue only.", "Not the issue.", "No."]
      - q: "A question covering two issues with one set of answers is:"
        o: ["Double-barreled", "Leading", "One-sided", "Unstructured"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
    practice:
      - q: "'How satisfied are you with our prices and staff friendliness?' is flawed because it is:"
        t: app
        o: ["Double-barreled", "Leading", "Sensitive", "Unfamiliar"]
        a: A
        e: ["Correct — two issues, one answer.", "No.", "No.", "No."]
      - q: "'Since caffeine is a stimulant, should children be allowed to drink Coca-Cola in school?' contains:"
        o: ["An implicit assumption", "A double barrel", "A structured scale", "No problem"]
        a: A
        e: ["Correct (slide example).", "No.", "No.", "No."]
      - q: "'Fast food is responsible for adult obesity: Agree/Disagree' is a:"
        o: ["One-sided question", "Double-barreled question", "Projective technique", "Good question"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "'How much did you spend on groceries last month?' should be avoided because:"
        o: ["Respondents can't easily or accurately answer it", "It's leading", "It's double-barreled", "It's open-ended"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Which is the better question per the slides?"
        t: app
        o: ["'Please rate how safe you believe a Volvo is, 1–10'", "'Volvo is the safest car, right?'", "'Do you dye your hair?'", "'Are mechanical watches better than quartz?'"]
        a: A
        e: ["Correct — neutral.", "Leading.", "Sensitive.", "Complex/unfamiliar."]

  - id: ch7-panel-scanner
    title: Panel & scanner-based data
    src: "Ch. 7 slides, pp. 22, 27–28, 42"
    explain: >-
      Panel research collects ongoing purchase and behaviour data from the same group of consumers over time, tracking changes in
      preferences and responses to marketing. Scanner-based research captures real-time sales data at checkout from UPC codes,
      measuring how pricing, promotions and placement affect store sales. Both are often syndicated and together evaluate marketing
      strategies and improve product development.
    alt: >-
      Scanner data is the receipt — what sold, when, where. Panel data is the diary — the same people tracked over time.
    terms:
      Panel data: "Ongoing data from the same group of consumers over time."
      Scanner data: "Data from readings of UPC codes at checkout counters."
    example: "Illustrative (from slides): the New Balance Tester Community panel gives ongoing feedback to refine sneakers."
    recall:
      - q: "Quantitative research data obtained from UPC readings at checkout is:"
        o: ["Panel data", "Syndicated data", "Scanner data", "Primary data"]
        a: C
        e: ["Panel = same people over time.", "Scanner data can be syndicated, but the specific term is scanner.", "Correct.", "No."]
      - q: "Data collected from the same group of consumers over time is:"
        o: ["Panel data", "Scanner data", "Census data", "Focus group data"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
    practice:
      - q: "The New Balance Tester Community gives ongoing feedback on sneakers. This is:"
        t: app
        o: ["Panel research", "Scanner research", "A one-time survey", "Secondary census data"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "A chain measures how a weekend promotion changed store-level sales from checkout data. This uses:"
        t: app
        o: ["Scanner data", "Panel data", "Focus groups", "In-depth interviews"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "A key advantage of panel data is the ability to:"
        o: ["Track changes in the same consumers over time", "Capture opinions with no cost", "Avoid any sampling", "Replace experiments"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Scanner and panel data are typically purchased as:"
        o: ["Syndicated external secondary data", "Internal secondary data", "Projective data", "Qualitative data"]
        a: A
        e: ["Correct (p.22).", "No.", "No.", "No."]
      - q: "Scanner-based research mainly measures the effect of:"
        o: ["Pricing, promotions and placement on sales", "Culture on values", "Interest rates on debt", "Employees on R&D"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]

  - id: ch7-experimental
    title: Experimental research
    src: "Ch. 7 slides, p. 45"
    explain: >-
      Experimental research manipulates one or more variables to determine their causal effect on outcomes such as sales, demand or
      profitability. Firms test pricing, advertising or product variations across test conditions and compare results to make
      evidence-based decisions.
    alt: >-
      An experiment is an A/B test: change one thing, hold the rest steady, and see what it causes.
    terms:
      Experimental research: "Manipulating variables to determine their causal effect on outcomes."
    example: "Illustrative (from slides): McDonald's tests different prices for a new combo across markets to find the most profitable price."
    recall:
      - q: "Experimental research aims to determine:"
        o: ["Causal effects", "Brand names", "Census totals", "Cultural values"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "McDonald's testing different combo prices across markets is:"
        o: ["Experimental research", "Observation", "Focus group", "Secondary data"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
    practice:
      - q: "An online store shows half its visitors a red 'Buy' button and half a green one, then compares sales. This is:"
        t: app
        o: ["An experiment", "A focus group", "Panel research", "A projective technique"]
        a: A
