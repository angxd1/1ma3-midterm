        e: ["Correct.", "No — that's per segment.", "No.", "No."]
      - q: "Why must firms 'balance value gained vs expense' in micromarketing?"
        o: ["It has higher cost and complexity", "It is illegal", "It reduces relationships", "It lowers personalisation"]
        a: A
        e: ["Correct.", "No.", "It strengthens them.", "No."]
      - q: "Micromarketing is described as more feasible:"
        o: ["Online, where customisation can scale", "Only in physical stores", "Only for commodities", "Only in rural areas"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Mariposa builds custom bicycles for individual racers. The notes classify this as:"
        t: app
        o: ["Micromarketing", "Differentiated", "Undifferentiated", "Geographic segmentation"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
      - q: "Which is a benefit of micromarketing?"
        o: ["Highly personalised value and stronger relationships", "Lowest cost per unit", "Same message for all", "No data needed"]
        a: A
        e: ["Correct.", "No.", "No.", "No."]
    examples:
      - q: "Which example best fits micromarketing?"
        o: ["Personalised M&M's printed with your own message", "Table salt sold to everyone", "Condé Nast's range of magazines", "Newton Running for forefoot runners"]
        a: A
        e: ["Correct.", "Undifferentiated.", "Differentiated.", "Concentrated."]
